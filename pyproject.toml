[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "django-suap-auth"
version = "1.7.0"
description = "Django OAuth2 authentication backend for SUAP (IFRN academic management system)"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "kelsoncm" }]
requires-python = ">=3.10"
dependencies = [
    "Django>=5.2,<7",
    "requests>=2.31",
    "django-simple-history>=3.13.0",
    "django-json-widget>=2.1.1",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-django>=4.8",
    "pytest-cov>=5.0",
    "responses>=0.25",
    "black>=24.0",
    "ruff>=0.4",
    "pre-commit>=3.7",
    "sphinx>=8.0",
    "django-docs-theme>=0.1.8",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
addopts = "-v --cov=django_suap_auth --cov-report=term-missing"
pythonpath = ["."]
python_files = ["tests.py", "test_*.py", "*_test.py"]

[tool.coverage.run]
source = ["django_suap_auth"]
omit = ["tests/*", "sandbox/*", "*/tests.py"]

[tool.coverage.report]
fail_under = 100
show_missing = true

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.setuptools.packages.find]
where = ["."]
include = ["django_suap_auth*"]

[tool.setuptools.package-data]
"*" = ["*.html", "*.css", "*.js", "*.png", "*.jpg", "*.svg"]
